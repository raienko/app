name: Verify

# The one check every flow runs: the same `yarn verify` as .husky/pre-push.
# Call it from another workflow with `uses: ./.github/workflows/verify.yml`,
# or run it by hand on any branch from the Actions tab.
on:
  workflow_call:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      # postinstall applies assets/brand (writes .env, generated assets and
      # the palette), so nothing else needs setting up.
      - run: yarn install --frozen-lockfile
      - run: yarn verify
