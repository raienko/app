name: Checks

# Every quality gate, one job each, so a pull request lists them by name
# ("Checks / Lint", "Checks / Web build", …) and branch protection can
# require exactly the ones that matter. The same gates as `yarn verify`
# (and .husky/pre-push), plus the builds that are too slow for a push hook.
#
# Manual for now: run it from the Actions tab, or call it from another
# workflow with `uses: ./.github/workflows/checks.yml`. To run it on every
# pull request and on main again, add:
#
#   push:
#     branches: [main]
#   pull_request:
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up project
        uses: ./.github/actions/setup
      - name: Check formatting
        run: yarn format:check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up project
        uses: ./.github/actions/setup
      - name: Lint
        run: yarn lint

  types:
    name: Types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up project
        uses: ./.github/actions/setup
      - name: Check types
        run: yarn typecheck

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up project
        uses: ./.github/actions/setup
      - name: Restore Jest cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .jest-cache
          key: jest-${{ runner.os }}-${{ hashFiles('yarn.lock') }}-${{ github.sha }}
          restore-keys: jest-${{ runner.os }}-${{ hashFiles('yarn.lock') }}-
      - name: Run unit tests with coverage
        run: yarn test:coverage --cacheDirectory .jest-cache
      - name: Publish coverage summary
        if: always()
        run: node scripts/ci/coverage-summary.mjs

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up project
        uses: ./.github/actions/setup
      - name: Scan for committed secrets
        run: yarn secrets:check

  expo-doctor:
    name: Expo Doctor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up project
        uses: ./.github/actions/setup
      - name: Check SDK versions and project setup
        run: yarn doctor

  web-build:
    name: Web build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up project
        uses: ./.github/actions/setup
      # Server output: renders every page in Node and bundles the API
      # routes, so this is where code that needs a browser at import time
      # fails — not at deploy.
      - name: Export the web app and API routes
        run: yarn web:build

  native-bundles:
    name: Native bundles
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up project
        uses: ./.github/actions/setup
      # The iOS and Android JavaScript bundles, built on Linux: catches a
      # broken import or a Metro error on native without Xcode or Gradle.
      - name: Bundle iOS and Android
        run: yarn native:bundle

  storybook-build:
    name: Storybook build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up project
        uses: ./.github/actions/setup
      - name: Build web Storybook
        run: yarn storybook:web:build

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Packages this branch adds or changes compared with main: known
      # vulnerabilities (moderate and up) and copyleft licences fail it.
      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          base-ref: ${{ github.event.pull_request.base.sha || 'main' }}
          head-ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fail-on-severity: moderate
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0, LGPL-2.1, LGPL-3.0
