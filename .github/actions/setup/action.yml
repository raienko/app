name: Set up project
description: >
  Node from .nvmrc, the Yarn cache, and a frozen-lockfile install. The
  install's postinstall applies assets/brand (writes .env, the generated
  assets and the palette), so nothing else needs setting up.

runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version-file: .nvmrc
        cache: yarn

    - name: Install dependencies
      shell: bash
      run: yarn install --frozen-lockfile
